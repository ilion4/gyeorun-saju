<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>결제 실패 — 백도령 만세력</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet" />
<style>
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; background: linear-gradient(180deg, rgba(10,10,26,.55), rgba(8,8,20,.85)), url('/media/bg.jpg'); background-size:cover; background-position:center top; background-attachment:fixed; color:#ECE6D6; font-family:'Pretendard',sans-serif; }
  .box { text-align:center; max-width:320px; padding: 0 24px; }
  h1 { font-family:'Noto Serif KR'; font-size:19px; color:#F3ECDD; }
  p { font-size:13.5px; color:#A9A6C4; }
  a.btn { display:inline-block; margin-top:22px; padding:13px 22px; border-radius:12px; background:rgba(35,35,75,.75); backdrop-filter:blur(10px); border:1px solid #33335F; color:#ECE6D6; text-decoration:none; font-weight:700; font-size:14.5px; }
</style>
</head>
<body>
  <div class="box">
    <h1>결제가 완료되지 않았어요</h1>
    <p id="msg">결제가 취소되었거나 오류가 발생했습니다.</p>
    <a class="btn" href="/">다시 시도하기</a>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const m = params.get('message');
  if (m) document.getElementById('msg').textContent = decodeURIComponent(m);
</script>
</body>
</html>
